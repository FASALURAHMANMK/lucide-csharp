name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Decode signing certificate
        if: ${{ secrets.SIGNING_CERT_PFX_B64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "lucide-signing.pfx"
          $bytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERT_PFX_B64 }}")
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "SIGNING_CERT_PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign packages
        if: ${{ secrets.SIGNING_CERT_PFX_B64 != '' }}
        shell: pwsh
        run: |
          if (-not $env:SIGNING_CERT_PFX_PATH) { throw "Missing SIGNING_CERT_PFX_PATH" }
          if (-not "${{ secrets.SIGNING_CERT_PASSWORD }}") { throw "Missing SIGNING_CERT_PASSWORD secret" }

          $timestampUrl = "${{ secrets.SIGNING_TIMESTAMP_URL }}"
          if ([string]::IsNullOrWhiteSpace($timestampUrl)) {
            $timestampUrl = "http://timestamp.digicert.com"
          }

          Get-ChildItem -Path "artifacts" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget sign $_.FullName --certificate-path "$env:SIGNING_CERT_PFX_PATH" --certificate-password "${{ secrets.SIGNING_CERT_PASSWORD }}" --timestamper $timestampUrl
          }

          Get-ChildItem -Path "artifacts" -Filter "*.snupkg" | ForEach-Object {
            dotnet nuget sign $_.FullName --certificate-path "$env:SIGNING_CERT_PFX_PATH" --certificate-password "${{ secrets.SIGNING_CERT_PASSWORD }}" --timestamper $timestampUrl
          }

      - name: Verify signatures
        if: ${{ secrets.SIGNING_CERT_PFX_B64 != '' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "artifacts" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget verify $_.FullName --all
          }

      - name: Publish to NuGet
        shell: pwsh
        run: |
          Get-ChildItem -Path "artifacts" -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

          Get-ChildItem -Path "artifacts" -Filter "*.snupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          }

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content -Path "CHANGELOG.md"
          $collect = $false
          $notes = New-Object System.Collections.Generic.List[string]

          foreach ($line in $lines) {
            if ($line -match "^##\s+\[?$version\]?") {
              $collect = $true
              continue
            }

            if ($collect -and $line -match "^##\s+") {
              break
            }

            if ($collect) {
              $notes.Add($line)
            }
          }

          $body = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "Release $version"
          } else {
            $body = "## $version`n" + $body
          }

          Set-Content -Path "release-notes.md" -Value $body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
